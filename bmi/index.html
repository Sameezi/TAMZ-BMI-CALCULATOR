<!doctype html>
<html>
  <!--Made by: Sameezi-->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"
    ></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" rel="stylesheet" />
  </head>

  <body>
    <ion-app>
      <ion-tabs>
        <ion-tab tab="home">
          <div id="home-page" class="ion-page">
            <ion-header>
              <ion-toolbar>
                <ion-title>BMI Calculator</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content class="ion-padding">
              <ion-card>
                <ion-card-content>
                  <ion-item>
                    <ion-input placeholder="Name" id="input-name"></ion-input>
                    <ion-icon slot="start" name="person-outline" aria-hidden="true"></ion-icon>
                  </ion-item>
                </ion-card-content>
              </ion-card>
              <ion-card>
                <ion-card-content>
                  <ion-item>
                    <ion-input placeholder="Age" id="input-age"></ion-input>
                    <ion-icon
                      slot="start"
                      name="calendar-clear-outline"
                      aria-hidden="true"
                    ></ion-icon>
                  </ion-item>
                </ion-card-content>
              </ion-card>
              <ion-card>
                <ion-card-header>
                  <ion-list id="radio-1">
                    <ion-radio-group value="truncated" id="radio-1-selection">
                      <ion-item> <ion-radio value="Male">Male</ion-radio><br /> </ion-item>
                      <ion-item> <ion-radio value="Female">Female</ion-radio><br /> </ion-item>
                    </ion-radio-group>
                  </ion-list>
                </ion-card-header>
              </ion-card>
              <ion-card>
                <ion-card-header>
                  <ion-range
                    labelPlacement="start"
                    aria-label="Range with height"
                    id="range-height"
                    pin="true"
                    min="140"
                    max="300"
                  >
                    <ion-icon
                      slot="start"
                      name="accessibility-outline"
                      aria-hidden="true"
                    ></ion-icon
                  ></ion-range>
                  <ion-text style="color: #ffffff" id="Text-height">height: </ion-text>
                  <ion-range
                    labelPlacement="start"
                    aria-label="Range with weight"
                    id="range-weight"
                    pin="true"
                    min="1"
                    max="500"
                  >
                    <ion-icon slot="start" name="scale-outline" aria-hidden="true"></ion-icon
                  ></ion-range>
                  <ion-text style="color: #ffffff" id="Text-weight">weight: </ion-text>
                </ion-card-header>
              </ion-card>
              <ion-card>
                <ion-card-header>
                  <ion-button shape="round" onclick="openModal()">Calculate</ion-button>
                </ion-card-header>
              </ion-card>
              <ion-modal initial-breakpoint="0.35"> </ion-modal>
              <ion-alert header="Fill all the information!" message="Message"></ion-alert>
            </ion-content>
          </div>
        </ion-tab>

        <ion-tab tab="list">
          <div id="radio-page" class="ion-page">
            <ion-header>
              <ion-toolbar>
                <ion-title>BMI Records</ion-title>
              </ion-toolbar>
            </ion-header>
            <ion-content>
              <ion-fab slot="fixed" vertical="bottom" horizontal="end">
                <ion-fab-button>
                  <ion-icon name="chevron-up-circle"></ion-icon>
                </ion-fab-button>
                <ion-fab-list side="top">
                  <ion-fab-button>
                    <ion-icon name="trash"></ion-icon>
                  </ion-fab-button>
                </ion-fab-list>
              </ion-fab>
              <ul id="ion-list"></ul>
              <ion-list id="ionic-list" inset="true"> </ion-list>
            </ion-content>
          </div>
        </ion-tab>

        <ion-tab-bar slot="bottom">
          <ion-tab-button tab="home">
            <ion-icon name="home"></ion-icon>
            Home
          </ion-tab-button>
          <ion-tab-button tab="list">
            <ion-icon name="list-outline"></ion-icon>
            List
          </ion-tab-button>
        </ion-tab-bar>
      </ion-tabs>
    </ion-app>

    <script>
      //Variables
      const height_range = document.getElementById('range-height');
      const weight_range = document.getElementById('range-weight');
      const name_field = document.getElementById('input-name');
      const age_field = document.getElementById('input-age');
      const gender_field = document.getElementById('radio-1-selection');
      const alert = document.querySelector('ion-alert');
      alert.buttons = ['OK'];
      const modal = document.querySelector('ion-modal');
      const tabs = document.querySelector('ion-tabs');

      //Listners
      weight_range.addEventListener('ionChange', ({ detail }) => {
        document.getElementById('Text-weight').textContent = 'weight: ' + detail.value + ' kg';
      });

      height_range.addEventListener('ionChange', ({ detail }) => {
        document.getElementById('Text-height').textContent = 'height: ' + detail.value + ' cm';
      });

      alert.addEventListener('ionAlertDidDismiss', () => {
        alert.isOpen = false;
      });

      tabs.addEventListener('ionTabsWillChange', () => {
        showItems();
      });

      modal.addEventListener('ionModalDidDismiss', () => {
        modal.isOpen = false;
      });

      //functions
      function itemClick(id) {
        console.log('Item ID: ' + id);
      }

      function openModal() {
        if (name_field.value == '') {
          alert.message = 'field name is empty!';
          alert.isOpen = true;
          console.log('no name');
          return;
        }
        if (age_field.value == '') {
          alert.message = 'field age is empty!';
          alert.isOpen = true;
          console.log('no age');
          return;
        }
        if (gender_field.value == 'truncated') {
          alert.message = 'gender is not selected!';
          alert.isOpen = true;
          console.log('no gender');
          return;
        }
        if (height_range.value === 0) {
          alert.message = 'height is not selected!';
          alert.isOpen = true;
          console.log('no height');
          return;
        }
        if (weight_range.value === 0) {
          alert.message = 'weight is not selected!';
          alert.isOpen = true;
          console.log('no weight');
          return;
        }

        modal.innerHTML = `
        <ion-content>
              <ion-header>
                <ion-toolbar id='modal-toolbar'>
                  <ion-title id="Text-evaluation" >Here goes evaluation string</ion-title>
                </ion-toolbar>
              </ion-header>
              <ion-list style='background: #6ba200'>
                <ion-item class='info-list'>
                  <ion-label id='info-name'>NAME: </ion-label>
                </ion-item>
                <ion-item class='info-list'>
                  <ion-label id='info-age'>AGE: </ion-label>
                </ion-item>
                <ion-item class='info-list'>
                  <ion-label id='info-gender'>GENDER: </ion-label>
                </ion-item>
                <ion-item class='info-list'>
                  <ion-label id='info-height'>HEIGHT: </ion-label>
                </ion-item>
                <ion-item class='info-list'>
                  <ion-label id='info-weight'>WEIGHT: </ion-label>
                </ion-item>
              </ion-list>
            </ion-content>
              `;

        modal.isOpen = true;
        calculateBMI();
      }

      function calculateBMI() {
        let bmi = weight_range.value / (height_range.value / 100) ** 2;

        console.log('bmi: ' + bmi);
        document.getElementById('info-name').textContent = name_field.value;
        document.getElementById('info-age').textContent = age_field.value;
        document.getElementById('info-gender').textContent = gender_field.value;
        document.getElementById('info-height').textContent = height_range.value + ' cm';
        document.getElementById('info-weight').textContent = weight_range.value + ' kg';
        document.getElementById('Text-evaluation').textContent = 'You are ';
        addItem(bmi);

        if (bmi < 18.5) {
          document.getElementById('Text-evaluation').textContent += 'underweight!';
          document.getElementById('modal-toolbar').style =
            '--background: radial-gradient(circle,rgb(209, 132, 96) 23%, rgba(84, 219, 50, 1) 100%);';
          return;
        }
        if (bmi < 24.9) {
          document.getElementById('Text-evaluation').textContent += 'healthy';
          return;
        }
        if (bmi < 29.9) {
          document.getElementById('Text-evaluation').textContent += 'overweight';
          document.getElementById('modal-toolbar').style =
            '--background: radial-gradient(circle,rgb(209, 209, 96) 23%, rgba(84, 219, 50, 1) 100%);';

          return;
        }
        if (bmi > 30) {
          document.getElementById('Text-evaluation').textContent += 'obese!';
          document.getElementById('modal-toolbar').style =
            '--background: radial-gradient(circle,rgb(209, 132, 96) 23%, rgba(84, 219, 50, 1) 100%);';
          return;
        }
      }

      function addItem(result) {
        let data = {
          name: name_field.value,
          age: age_field.value,
          gender: gender_field.value,
          height: height_range.value,
          weight: weight_range.value,
          bmi: result,
        };

        let offset = localStorage.length;
        while (localStorage['record-' + offset] != undefined) {
          offset += 1;
        }
        let key = 'record-' + offset;

        localStorage.setItem(key, JSON.stringify(data));
      }

      function showItems() {
        let el = document.getElementById('ionic-list');
        el.innerHTML = '';
        for (const [key, value] of Object.entries(localStorage)) {
          let json = localStorage.getItem(key);
          let data = JSON.parse(json);
          let node = document.createElement('ion-item-sliding');
          node.innerHTML = `
                     <ion-card id = "${key}">
                     <ion-item class = 'record'>
                        <ion-icon style='--color: #fff;' slot="start" name="calculator" size="large"></ion-icon>
                       <ion-label style="font-size: 21px;">${data.name}</ion-label>
                        <div class="metadata-end-wrapper" slot="end">
                         <ion-note color="medium">note here</ion-note>
                         <ion-icon color="medium" name="chevron-back-sharp"></ion-icon>
                       </div>
                     </ion-item>
                      <ion-item-options>
                       <ion-item-option color="danger" expandable>
                        <ion-icon slot="icon-only" name="trash"></ion-icon>
                        </ion-item-option>
                       </ion-item-options>
                       </ion-card>
                      `;

          // Listeners
          node.addEventListener('click', (e) => {
            if (e.target.getAttribute('name') === 'trash') {
              const id = e.target.closest('ion-card').id;
              destItem(id);
            }
          });

          document.getElementById('ionic-list').appendChild(node);
        }
      }
      function destItems() {
        console.log('localStorage destroyed');
        localStorage.clear();
      }

      function destItem(id) {
        console.log('Destroying ' + id);
        localStorage.removeItem(id);
        showItems();
      }
    </script>
  </body>
</html>
