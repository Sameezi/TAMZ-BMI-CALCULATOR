<!doctype html>
<html>
  <!--Made by: Sameezi-->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"
    ></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" rel="stylesheet" />
  </head>

  <body>
    <ion-app>
      <ion-header>
        <ion-toolbar>
          <ion-title>BMI</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-footer>
        <ion-toolbar>
          <div class="centering-buttons">
            <ion-button>
              <ion-icon slot="icon-only" name="home" (click)="goPage1()"></ion-icon>
            </ion-button>
            <ion-button>
              <ion-icon
                slot="icon-only"
                name="list"
                routerLink="/page2"
                (click)="goPage2()"
              ></ion-icon>
            </ion-button>
          </div>
        </ion-toolbar>
      </ion-footer>

      <ion-content class="ion-padding">
        <ion-card>
          <ion-card-content>
            <ion-item>
              <ion-input placeholder="Name" id="input-name"></ion-input>
              <ion-icon slot="start" name="person-outline" aria-hidden="true"></ion-icon>
            </ion-item>
          </ion-card-content>
        </ion-card>
        <ion-card>
          <ion-card-content>
            <ion-item>
              <ion-input placeholder="Age" id="input-age"></ion-input>
              <ion-icon slot="start" name="calendar-clear-outline" aria-hidden="true"></ion-icon>
            </ion-item>
          </ion-card-content>
        </ion-card>
        <ion-card>
          <ion-card-header>
            <ion-list id="radio-1">
              <ion-radio-group value="truncated" id="radio-1-selection">
                <ion-item> <ion-radio value="Male">Male</ion-radio><br /> </ion-item>
                <ion-item> <ion-radio value="Female">Female</ion-radio><br /> </ion-item>
              </ion-radio-group>
            </ion-list>
          </ion-card-header>
        </ion-card>
        <ion-card>
          <ion-card-header>
            <ion-range
              labelPlacement="start"
              aria-label="Range with height"
              id="range-height"
              pin="true"
              min="140"
              max="300"
            >
              <ion-icon slot="start" name="accessibility-outline" aria-hidden="true"></ion-icon
            ></ion-range>
            <ion-text style="color: #ffffff" id="Text-height">height: </ion-text>
            <ion-range
              labelPlacement="start"
              aria-label="Range with weight"
              id="range-weight"
              pin="true"
              min="1"
              max="500"
            >
              <ion-icon slot="start" name="scale-outline" aria-hidden="true"></ion-icon
            ></ion-range>
            <ion-text style="color: #ffffff" id="Text-weight">weight: </ion-text>
          </ion-card-header>
        </ion-card>
        <ion-card>
          <ion-card-header>
            <ion-button shape="round" onclick="openModal()">Calculate</ion-button>
          </ion-card-header>
        </ion-card>
      </ion-content>

      <ion-modal initial-breakpoint="0.35"> </ion-modal>

      <ion-alert header="Fill all the information!" message="Message"></ion-alert>
    </ion-app>
    <script src="src/app.js"></script>
  </body>
</html>

<style>
  body {
    font-family: 'Roboto', sans-serif;
  }
  ion-card {
    --background: #6ba200;
    --background: linear-gradient(0deg, rgba(108, 162, 0, 0) 0%, rgba(34, 108, 2, 0.716) 100%);
  }
  ion-content {
    --background: #69a500;
    --background: radial-gradient(circle, #83a844 0%, #82cc6e 100%);
  }
  ion-toolbar {
    --background: #69a500;
    --background: radial-gradient(circle, rgba(105, 165, 0, 1) 0%, rgba(130, 204, 110, 1) 100%);
  }
  ion-range {
    --bar-background: #bac910;
    --bar-background-active: #e4f806;
    --pin-background: #e4f806;
    --pin-color: #000;
  }
  ion-item {
    --background: transparent;
    --background-activated: #eaeaea;
    --background-focused: #eaeaea;
    --background-hover: #eaeaea;
    --color: #ffffff;
  }
  ion-button {
    --background: #aebe00;
    --color: #ffffff;
    margin-left: 2vh;
    margin-right: 2vh;
  }
  ion-icon {
    color: #ffffff;
  }
  ion-radio {
    --color: #e4f806;
    --color-checked: #e4f806;
  }
  ion-alert {
    --background: #6ba200;
    --background: linear-gradient(0deg, rgba(107, 162, 0, 1) 0%, rgba(34, 108, 2, 1) 100%);
  }

  .info-list {
    --background: #6ba200;
  }
  #radio-1 {
    --background: transparent;
    background: transparent;
  }
  .centering-buttons {
    display: flex;
    justify-content: center;
    align-items: center;
  }
</style>
